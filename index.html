<title>Bellect株式会社 ｜ Personalized Beauty &amp; Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #000000;
    --gold:  #d9ae3d;
    --paper: #fffff9;

    --ink:       var(--black);
    --ink-soft:  rgba(0,0,0,0.62);
    --hairline:  rgba(0,0,0,0.12);
    --gold-wash: rgba(217,174,61,0.07);

    --display: 'Newsreader', 'Zen Old Mincho', serif;
    --serif-jp: 'Zen Old Mincho', serif;
    --body: 'Zen Kaku Gothic New', sans-serif;

    --max: 1220px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-weight:400;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{ display:block; max-width:100%; }
  a{ color:inherit; text-decoration:none; }

  .wrap{ max-width:var(--max); margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 22px; } }

  .eyebrow{
    display:inline-block;
    font-family:var(--display);
    font-style:normal;
    font-weight:500;
    font-size:12.5px;
    letter-spacing:0.26em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:14px;
  }

  h1,h2,h3{ font-family:var(--serif-jp); font-weight:600; color:var(--ink); }

  /* ===== 「縫い目」= 蝶の折り目をイメージした、斜めのゴールドの一本線 ===== */
  .seam{ position:relative; height:0; overflow:visible; }
  .seam::before{
    content:''; position:absolute; left:-6%; right:-6%; top:0; height:1px;
    background:var(--gold); transform:rotate(-0.55deg); transform-origin:left center;
  }

  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:rgba(255,254,247,0);
    transition:background .4s ease, box-shadow .4s ease, backdrop-filter .4s ease;
  }
  header.nav.solid{
    background:rgba(255,254,247,0.92);
    backdrop-filter:blur(6px);
    box-shadow:0 1px 0 rgba(0,0,0,0.08);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:20px 0; }
  .brand-mark{ display:flex; align-items:center; }
  .brand-mark img{ height:26px; width:auto; display:block; }
  nav.links{ display:flex; gap:36px; }
  nav.links a{
    font-family:var(--display); font-size:13.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-soft); position:relative; padding-bottom:4px;
  }
  nav.links a::after{
    content:''; position:absolute; left:0; right:100%; bottom:0; height:1px;
    background:var(--gold); transition:right .3s ease;
  }
  nav.links a:hover::after{ right:0; }
  .nav-cta{
    font-size:12.5px; letter-spacing:0.08em; border:1px solid var(--ink);
    padding:9px 20px; border-radius:999px; white-space:nowrap;
  }
  .nav-cta:hover{ background:var(--ink); color:var(--paper); }

  /* ===== ハンバーガーボタン（スマホのみ表示） ===== */
  .nav-toggle{
    display:none; width:40px; height:40px; padding:0; border:none; background:none; cursor:pointer;
    flex-direction:column; justify-content:center; align-items:flex-end; gap:5px;
  }
  .nav-toggle span{ display:block; width:22px; height:1.5px; background:var(--ink); transition:transform .3s ease, opacity .3s ease; }
  .nav-toggle.open span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2){ opacity:0; }
  .nav-toggle.open span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }

  @media (max-width:860px){
    nav.links{ display:none; }
    .nav-toggle{ display:inline-flex; }
    /* タップで開くドロップダウンメニュー */
    nav.links.open{
      display:flex; flex-direction:column; gap:0;
      position:absolute; top:100%; left:0; right:0;
      background:rgba(255,254,247,0.98); backdrop-filter:blur(8px);
      padding:6px 22px 16px; border-top:1px solid var(--hairline);
      box-shadow:0 10px 22px rgba(0,0,0,0.07);
    }
    nav.links.open a{
      padding:15px 2px; font-size:14px; letter-spacing:.14em;
      border-bottom:1px solid var(--hairline); color:var(--ink);
    }
    nav.links.open a:last-child{ border-bottom:none; }
    nav.links.open a::after{ display:none; }  /* ドロップダウンでは下線アニメ不要 */
  }

  /* ===== Hero：左右非対称。中央寄せをやめる ===== */
  .hero{
    position:relative;
    display:grid; grid-template-columns:1.15fr 0.85fr; align-items:center; gap:24px;
    padding:148px 0 84px;
    overflow:hidden;
  }
  .hero-text{ padding:0; }   /* PC：従来通りフラット（旧インライン padding:0 と同等） */
  @media (max-width:860px){
    /* スマホ：蝶を大きな背景モチーフとして右にはみ出させ、見出しはその手前(z-index)に重ねる */
    .hero{ display:block; position:relative; overflow:hidden; padding:118px 0 56px; }
    .hero-text{ position:relative; z-index:2; padding-left:32px; padding-right:32px; }
    .hero h1 em{ white-space:normal; }        /* 狭い幅でも折り返せるように */
    /* 特異性を .hero .hero-visual に上げ、後続の基本ルール(155/187行)に勝たせる */
    .hero .hero-visual{
      position:absolute; z-index:0; top:50%; right:-22%;
      transform:translateY(-50%);
      width:92%; max-width:none; margin:0; opacity:.2; pointer-events:none;
      animation:none;                          /* 背景装飾として静止表示 */
    }
    .hero .hero-visual svg{ width:100%; height:auto; display:block; }
  }
  @media (max-width:640px){
    /* Aboutなど .wrap は 640px以下で padding 22px。ヒーロー文章もそれに揃える */
    .hero-text{ padding-left:22px; padding-right:22px; }
  }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeInScale{ from{ opacity:0; transform:scale(0.94); } to{ opacity:1; transform:scale(1); } }

  .hero-text .eyebrow{ margin-bottom:20px; opacity:0; animation:fadeUp .8s ease forwards .1s; }
  .hero h1{ opacity:0; animation:fadeUp .8s ease forwards .25s; }
  .hero p.lede{ opacity:0; animation:fadeUp .8s ease forwards .4s; }
  .hero-cta{ opacity:0; animation:fadeUp .8s ease forwards .55s; }
  .hero-visual{ opacity:0; animation:fadeInScale 1.1s ease forwards .35s; }

  .reveal{ opacity:0; transform:translateY(20px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion:reduce){
    .hero-text .eyebrow, .hero h1, .hero p.lede, .hero-cta, .hero-visual{ animation:none !important; opacity:1; }
    .reveal{ opacity:1; transform:none; transition:none; }
  }
  .hero h1{
    font-family:var(--display);
    font-style:normal;
    font-weight:300;
    font-size:clamp(30px,5vw,58px);
    line-height:1.18;
    color:var(--ink);
  }
  .hero h1 em{ font-style:normal; color:var(--gold); white-space:nowrap; }
  .hero p.lede{
    font-family:var(--serif-jp);
    font-size:clamp(14px,1.5vw,16.5px);
    color:var(--ink-soft);
    max-width:440px;
    margin-top:24px;
  }
  .hero-cta{
    display:inline-flex; align-items:center; gap:10px;
    margin-top:38px; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink); border-bottom:1px solid var(--gold); padding-bottom:6px;
  }
  .hero-cta svg{ width:12px; height:12px; }

  .hero-visual{ width:58%; margin:34px auto 0; position:relative; }
  @media (min-width:861px){
    .hero-visual{ width:132%; margin:0 -24% 0 auto; justify-self:end; }
  }

  section{ position:relative; padding:76px 0; }
  @media (max-width:640px){ section{ padding:56px 0; } }

  .about{ }
  .about-inner{ max-width:760px; }
  .about h2{ font-size:clamp(21px,2.4vw,28px); margin-bottom:22px; }
  .about p{ font-size:15.5px; color:var(--ink-soft); text-wrap:balance; }
  .about p + p{ margin-top:6px; }

  /* ===== Business：縦積みをやめ、横スクロールのルックブック形式に ===== */
  .biz-head{ margin-bottom:52px; }
  .biz-head h2{ font-size:clamp(22px,2.8vw,30px); }

  .biz-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:40px; text-align:center; }
  @media (max-width:860px){
    /* スマホは縦積みをやめ、横スワイプできるチップ状の並びに（1画面に2〜3枚見える幅） */
    .biz-grid{
      display:flex; gap:16px; overflow-x:auto;
      scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
      padding-bottom:18px; text-align:center;
    }
    .biz-item{ flex:0 0 42%; min-width:150px; scroll-snap-align:start; }
    .biz-copy{ min-height:auto; }
  }
  .biz-item{ display:flex; flex-direction:column; align-items:center; }
  .biz-copy{ min-height:6.6em; display:flex; align-items:flex-start; }

  .biz-icon{ height:72px; display:flex; align-items:flex-end; justify-content:center; margin-bottom:24px; }
  .biz-icon img{ max-height:100%; width:auto; }

  .biz-tag{
    display:block; font-family:var(--display); font-weight:500; font-size:19px;
    color:var(--gold); margin-bottom:20px;
  }
  .biz-copy p{ color:var(--ink-soft); font-size:13.5px; line-height:2; max-width:28ch; margin:0 auto; text-wrap:balance; }
  @media (max-width:760px){ .biz-copy p{ max-width:30ch; } }
  .biz-more{
    display:inline-flex; align-items:center; gap:5px; margin-top:auto; padding-top:20px;
    font-size:11px; letter-spacing:.08em; color:var(--ink);
    border-bottom:1px solid var(--gold); padding-bottom:2px;
    transition:.25s ease;
  }
  .biz-more:hover{ color:var(--gold-deep,var(--gold)); transform:translateY(-1px); }
  .biz-more svg{ width:9px; height:9px; transition:transform .25s ease; }
  .biz-more:hover svg{ transform:translateX(2px); }
  /* まだページが無い事業：クリック不可のグレー表示 */
  .biz-more--soon{
    color:var(--ink-soft); border-bottom-color:var(--hairline);
    cursor:default; pointer-events:none; opacity:.6;
  }
  .biz-more--soon:hover{ color:var(--ink-soft); transform:none; }

  .company-head{ margin-bottom:32px; }
  .company h2{ font-size:clamp(21px,2.4vw,28px); }
  dl.facts{ font-size:13.5px; max-width:760px; }
  dl.facts div{ display:flex; padding:15px 0; border-top:1px solid var(--hairline); gap:22px; }
  dl.facts div:last-child{ border-bottom:1px solid var(--hairline); }
  dl.facts dt{ width:100px; flex-shrink:0; color:var(--ink-soft); letter-spacing:.05em; }
  dl.facts dd{ color:var(--ink); }
  /* 事業内容：PCは「／」区切りの1行（従来通り） */
  dl.facts .svc + .svc::before{ content:"／"; color:var(--ink-soft); margin:0 1px; }
  /* スマホ(≤860px)だけ縦3行の箇条書き風に */
  @media (max-width:860px){
    dl.facts .svc{ display:block; }
    dl.facts .svc + .svc::before{ content:none; }
  }

  footer{ background:var(--paper); color:var(--ink); text-align:center; }
  footer .wrap{ padding:64px 0 40px; }
  footer h2{
    color:var(--ink-soft); font-family:var(--serif-jp); font-style:normal; font-weight:400;
    font-size:14px; letter-spacing:.02em; margin-bottom:26px;
  }
  .cta-btn{
    position:relative; overflow:hidden;
    display:inline-block; border:1px solid var(--gold); color:var(--ink);
    padding:14px 40px; border-radius:999px; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    transition:.3s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 8px 18px rgba(217,174,61,0.12);
  }
  .cta-btn::before{
    content:''; position:absolute; top:0; left:-40%; width:35%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.65), transparent);
    transform:skewX(-20deg); transition:left .6s ease; pointer-events:none;
  }
  .cta-btn:hover::before{ left:130%; }
  .cta-btn:hover{ background:var(--gold); color:var(--paper); }

  /* ===== お問い合わせフォーム（Contact） ===== */
  .contact-form{ max-width:480px; margin:8px auto 0; text-align:left; }
  .contact-form .field{ margin-bottom:20px; }
  .contact-form label{
    display:block; font-family:var(--body); font-size:12px; letter-spacing:.08em;
    color:var(--ink-soft); margin-bottom:8px;
  }
  .contact-form input,
  .contact-form textarea{
    width:100%; font-family:var(--body); font-size:15px; color:var(--ink); line-height:1.7;
    background:var(--paper); border:1px solid var(--hairline); border-radius:6px;
    padding:12px 14px; transition:border-color .25s ease, box-shadow .25s ease;
  }
  .contact-form textarea{ resize:vertical; min-height:130px; }
  .contact-form input:focus,
  .contact-form textarea:focus{
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash);
  }
  .contact-form .cf-hp{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .contact-form .cta-btn{
    margin-top:6px; cursor:pointer; background:transparent;
    font-family:var(--body); text-transform:none; font-size:13px;
  }
  .contact-form .cta-btn[disabled]{ opacity:.5; cursor:default; }
  .form-status{
    margin-top:18px; font-size:13px; letter-spacing:.03em; line-height:1.7; min-height:1.2em;
  }
  .form-status.ok{ color:var(--gold); }
  .form-status.err{ color:#b23b3b; }

  footer .fine{ margin-top:54px; font-size:11.5px; color:var(--ink-soft); letter-spacing:.04em; }

  @media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }
</style>
</head>

<header class="nav" id="siteNav">

  };

  document.getElementById('heroTitle').innerHTML = CONTENT.hero.titleHtml;
  document.getElementById('heroLede').textContent = CONTENT.hero.lede;
  document.getElementById('heroCtaLabel').textContent = CONTENT.hero.ctaLabel;

  document.getElementById('aboutHeading').textContent = CONTENT.about.heading;
  document.getElementById('aboutParagraphs').innerHTML =
    CONTENT.about.paragraphs.map(p => `<p>${p}</p>`).join('');

  document.getElementById('businessHeading').textContent = CONTENT.businessHeading;

  document.getElementById('bizGrid').innerHTML = CONTENT.business.map((b, i) => `
    <div class="biz-item reveal" style="transition-delay:${i * 0.12}s">
      <div class="biz-icon"><img src="${ICON_IMAGES[b.icon] || ''}" alt="${b.tag}"></div>
      <span class="biz-tag">${b.tag}</span>
      <div class="biz-copy"><p>${b.body}</p></div>
      ${b.ready
        ? `<a class="biz-more" href="${b.link}">詳しく見る
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>`
        : `<span class="biz-more biz-more--soon" aria-disabled="true">準備中</span>`}
    </div>
  `).join('');

  document.getElementById('companyFacts').innerHTML = CONTENT.company.facts.map(f => `
    <div><dt>${f.dt}</dt><dd>${f.dd}</dd></div>
  `).join('');

  document.getElementById('contactHeading').textContent = CONTENT.contact.heading;
  const btn = document.getElementById('contactBtn');
  btn.textContent = CONTENT.contact.buttonLabel;
  btn.href = CONTENT.contact.pageUrl;

  const nav = document.getElementById('siteNav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('solid', window.scrollY > 40);
  });

  // ===== ハンバーガーメニューの開閉 =====
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  const setMenu = (open) => {
    navLinks.classList.toggle('open', open);
    navToggle.classList.toggle('open', open);
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  navToggle.addEventListener('click', () => setMenu(!navLinks.classList.contains('open')));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setMenu(false)));

  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });

  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
</script>
